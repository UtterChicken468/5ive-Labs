<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5ive Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>5ive Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky model-builder rail on the left, tabbed results on the right; stacks to one column on phones. */
/* Ice: one committed dark look (slate + teal), the same in every viewer theme. */
:root {
  --bg: #0f1a22; --surface: #162631; --surface-2: #1c3040; --ink: #e6f0f2; --muted: #8fa6b0; --line: #27404e;
  --accent: #2dd4bf; --accent-ink: #04241f; --accent-soft: #0f3b37;
  --good: #8ee39b; --good-soft: #163a24; --bad: #ff8577; --bad-soft: #3e2025;
  --pos: #2dd4bf; --neg: #ff8577; --vegas: #5f7884;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
  --brand-ground: #132430; --brand-ink: #a3b9c2;
  color-scheme: dark;
}

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0 }
img { max-width: 100% }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.muted { color: var(--muted) }
.small { font-size: 13px }

/* masthead with yard-line hash strip */
/* masthead: the logo artwork is dark-ground, so the band keeps its own brand color in both themes */
header.mast { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
  background: var(--brand-ground); border-radius: var(--r); padding: 14px 20px; margin-bottom: 12px }
header.mast h1 { margin: 0; line-height: 0; min-width: 0 }
header.mast h1 img { display: block; height: clamp(54px, 9vw, 86px); width: auto; max-width: 100% }
.stamp { font-size: 13px; color: var(--brand-ink); max-width: 46ch }
.stamp b { color: #fff }
.hash { height: 10px; margin-bottom: 18px; border-top: 2px solid var(--line);
  background: repeating-linear-gradient(90deg, var(--muted) 0 2px, transparent 2px 10%), repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 2%);
  background-size: 100% 10px, 100% 5px; background-repeat: no-repeat; opacity: .55 }

.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 22px; align-items: start }
.layout.solo { grid-template-columns: minmax(0, 1fr) }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr) } }

/* sync */
.navrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; justify-content: space-between }
.navrow .sports { flex: 1 1 auto }
.syncbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted) }
.syncbtn.on { color: var(--good); border-color: var(--good) }
.syncbtn.err { color: var(--bad); border-color: var(--bad) }
.syncpanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; margin-bottom: 14px; display: grid; gap: 10px; max-width: 720px }
.syncpanel ol { margin: 0; padding-left: 20px; display: grid; gap: 4px }
.syncpanel .row { display: flex; gap: 8px; flex-wrap: wrap }
.syncpanel .row input { flex: 1 1 260px; font-family: ui-monospace, Menlo, monospace; font-size: 13px }

/* sport switcher */
.sports { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px }
.sport { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 14px;
  font-family: var(--display); font-size: 17px; font-weight: 600; text-transform: uppercase; color: var(--ink) }
.sport[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.sport.soon { color: var(--muted); border-style: dashed; display: inline-flex; gap: 6px; align-items: baseline; cursor: default }
.sport.soon small { font-family: var(--body); font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 500 }

/* builder rail */
aside.builder { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 18px; max-height: calc(100vh - 24px); overflow: auto }
aside.builder { grid-template-columns: minmax(0, 1fr) }
aside.builder > *, .sliders > *, .sl > *, .group > *, .saverow > * { min-width: 0 }
.group { grid-template-columns: minmax(0, 1fr) }
@media (max-width: 920px) { aside.builder { position: static; max-height: none } }
aside h2 { font-size: 22px; text-transform: uppercase }
.presets { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 500 }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.sliders { display: grid; gap: 12px }
.sl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center }
.sl .nm { font-weight: 600; font-size: 14px }
.sl .val { font-family: var(--display); font-size: 18px; font-weight: 600; min-width: 2.2ch; text-align: right }
.sl .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -2px }
.sl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0 }
.group { display: grid; gap: 12px; padding-top: 14px; border-top: 1px dashed var(--line) }
.saverow { display: flex; gap: 6px }
.saverow input { flex: 1; min-width: 0 }
input[type=text], input[type=number], select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; min-width: 0 }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 7px; padding: 6px 12px; font-weight: 600; font-size: 14px }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line) }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.saved { display: grid; gap: 4px }
.saved .row { display: flex; align-items: center; gap: 6px; font-size: 14px }
.saved .row button.link { background: none; border: 0; padding: 2px 0; text-align: left; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.saved .row .x { background: none; border: 0; color: var(--muted); padding: 2px 6px }

/* tabs */
nav.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); overflow-x: auto; margin-bottom: 16px }
nav.tabs button { background: none; border: 0; padding: 8px 14px 7px; font-family: var(--display); font-size: 18px; font-weight: 600;
  text-transform: uppercase; color: var(--muted); white-space: nowrap; border-radius: 7px 7px 0 0 }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink) }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; margin-bottom: 14px }
.toolbar .f { display: grid; gap: 3px }
.note { font-size: 13px; color: var(--muted); max-width: 70ch }

/* games */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 14px }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; min-width: 0 }
.game.hot { border-color: var(--accent) }
.gh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
.matchup { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.05; min-width: 0; overflow-wrap: anywhere }
.sport-cfb .matchup { font-size: 21px }
.wp div { overflow: hidden; text-overflow: ellipsis }
.matchup .at { color: var(--muted); font-weight: 500; font-size: 18px; margin: 0 4px }
.kick { font-size: 12.5px; color: var(--muted); text-align: right }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.score b { font-family: var(--display); font-size: 30px; line-height: 1 }
.wp { display: flex; height: 22px; border-radius: 5px; overflow: hidden; gap: 2px; font-size: 12px; font-weight: 600 }
.wp div { display: flex; align-items: center; padding: 0 7px; white-space: nowrap; min-width: 0 }
.wp .a { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 5px 0 0 5px }
.wp .h { background: var(--accent); color: var(--accent-ink); justify-content: flex-end; border-radius: 0 5px 5px 0 }
.mk { display: grid; grid-template-columns: 86px minmax(0,1fr) auto; gap: 6px 10px; align-items: center; font-size: 14px; padding-top: 8px; border-top: 1px solid var(--line) }
.mk .k { font-family: var(--display); font-weight: 600; font-size: 16px; text-transform: uppercase }
.mk .ins { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.mk input { width: 74px }
.mk .out { text-align: right; font-size: 13.5px }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap }
.pill.good { background: var(--good-soft); color: var(--good) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.flat { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line) }
.pill.acc { background: var(--accent-soft); color: var(--accent) }
.logbtn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; font-size: 12px; font-weight: 600; color: var(--muted) }
.logbtn:hover { border-color: var(--accent); color: var(--accent) }
.why { font-size: 12.5px; color: var(--muted) }

.move { display: block; font-size: 12px; margin-top: 2px }
.move.yes { color: var(--good) } .move.no { color: var(--muted) }
details.inj { font-size: 12.5px; color: var(--ink) }
details.inj summary { cursor: pointer; color: var(--muted); font-weight: 600 }
details.inj > div { margin-top: 4px }
.qbout { color: var(--bad) }
.goalies { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center }
.goalies select { max-width: 150px }
.gsel { display: inline-flex; gap: 6px; align-items: center; font-weight: 600 }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

/* tables */
.tblwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0 }
td.num, th.num { text-align: right }
tr:last-child td { border-bottom: 0 }
td input { width: 70px }
.pname { font-weight: 600 }
.spark { display: inline-flex; align-items: end; gap: 2px; height: 22px; vertical-align: middle }
.spark i { width: 5px; background: var(--muted); border-radius: 2px 2px 0 0; opacity: .55 }
.spark i.last { background: var(--accent); opacity: 1 }

/* rankings */
.rank { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px }
.rr { display: grid; grid-template-columns: 26px var(--teamcol, 46px) minmax(0,1fr) 54px; gap: 10px; align-items: center; font-size: 14px; padding: 3px 0 }
.rr .t { font-family: var(--display); font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sport-cfb { --teamcol: 150px }
@media (max-width: 520px) { .sport-cfb { --teamcol: 104px } }
.bar { position: relative; height: 16px }
.bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line) }
.bar span { position: absolute; top: 0; height: 100%; border-radius: 4px }
.rr .drv { grid-column: 3 / -1; font-size: 12px; color: var(--muted); margin-top: -4px }

/* accuracy */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px }
.tile b { font-family: var(--display); font-size: 32px; line-height: 1.05 }
.tile .sub { font-size: 13px; color: var(--muted) }
.wk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 10px }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px }
.wkrows { display: grid; gap: 8px }
.wkr { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 10px; align-items: center; font-size: 13.5px }
.wkbars { display: grid; gap: 2px }
.wkbars div { height: 12px; border-radius: 0 4px 4px 0; display: flex; align-items: center; justify-content: flex-end; min-width: 2px }
.wkbars div span { font-size: 11px; font-weight: 600; padding: 0 0 0 6px; transform: translateX(100%); color: var(--ink); white-space: nowrap }

/* log */
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; color: var(--muted) }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none }
.toast.on { opacity: 1 }
@media (prefers-reduced-motion: reduce) { .toast { transition: none } }
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <h1><img src="logo.png" width="950" height="306" alt="5ive Lab"></h1>
    <div class="stamp" id="stamp"></div>
  </header>
  <div class="navrow"><nav class="sports" id="sports" aria-label="Sport"></nav><button class="syncbtn" id="syncBtn" type="button">Sync: off</button></div>
  <section class="syncpanel" id="syncPanel" hidden></section>
  <div class="hash" aria-hidden="true"></div>

  <div class="layout">
    <aside class="builder" aria-label="Model builder">
      <div style="display:grid;gap:8px">
        <h2>Your model</h2>
        <div class="small muted">Slide each factor to say how much it should matter. Everything on the right updates as you go.</div>
        <div class="presets" id="presets"></div>
      </div>
      <div class="sliders" id="sliders"></div>
      <div class="group">
        <div class="label">Game settings</div>
        <div class="sliders" id="settings"></div>
      </div>
      <div class="group">
        <div class="label">Saved models</div>
        <div class="saverow"><input id="saveName" type="text" placeholder="Name this model" maxlength="28"><button class="btn" id="saveBtn">Save</button></div>
        <div class="saved" id="saved"></div>
      </div>
    </aside>

    <main style="min-width:0">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <section id="view"></section>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="engine.js"></script>
<script>
function boot(DATA) {
const E = window.Engine;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const META = DATA.meta || { sport: 'nfl', label: 'NFL', period: 'Week', props: true, hfa: 1.5, trust: 60, bye: 1, source: 'nflverse' };
E.configure(META);
const pre = META.sport === 'nfl' ? 'gml:' : 'gml:' + META.sport + ':';
const store = {
  get(k, d) { try { const v = localStorage.getItem(pre + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(pre + k, JSON.stringify(v)); } catch (e) {} window.Sync && Sync.changed(pre + k); },
};
const SPORT_DEFAULTS = sportDefaults(META);
const DAILY = META.period === 'Day';
const UNIT = META.unit || 'pts';
const EDGE_STEPS = META.edgeSteps || [1, 1.5, 2, 3, 4];
const dateOfW = {}; DATA.games.forEach((g) => { if (g.d && !(g.w in dateOfW)) dateOfW[g.w] = g.d; });
const shortDate = (iso, wd) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-US', wd ? { weekday: 'short', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric' }) : '';
const periodLabel = (w) => DAILY ? shortDate(dateOfW[w], true) : 'Week ' + w;
const todayISO = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });

const completed = DATA.games.filter((g) => g.hs != null);
const lastDone = completed.length ? Math.max(...completed.map((g) => g.w)) : 0;
let upcomingWeeks = [...new Set(DATA.games.filter((g) => g.hs == null && (!DAILY || !g.d || g.d >= todayISO)).map((g) => g.w))].sort((a, b) => a - b);
if (DAILY) upcomingWeeks = upcomingWeeks.slice(0, 10);
const seasonOver = !upcomingWeeks.length;
if (!upcomingWeeks.length) upcomingWeeks = [lastDone]; // season over: show the final week

const S = {
  weights: store.get('weights', { ...E.PRESETS.Balanced }),
  settings: { ...SPORT_DEFAULTS, ...store.get('settings', {}) },
  saved: store.get('saved', []),
  lines: store.get('lines', {}),        // gameId -> {sp, tot, hml, aml} user overrides
  props: store.get('props', {}),        // playerId|key -> {line, odds}
  picks: store.get('picks', []),
  tab: store.get('tab', 'games'),
  week: upcomingWeeks[0],
  sort: 'time', edgeMin: META.edgeDefault ?? 1.5, onlyEdges: false, teamQ: '',
  propKey: (E.PROPS[0] || {}).key, propPos: 'all', propQ: '', recent: 40, matchup: 60,
  btEdge: 0, confirmClear: false, battleA: 'current', battleB: '',
};
if (location.hash && ['games', 'props', 'rankings', 'accuracy', 'log'].includes(location.hash.slice(1))) S.tab = location.hash.slice(1);
if (S.tab === 'props' && !META.props) S.tab = 'games';

const fmt = (v, d = 1) => (v == null || isNaN(v)) ? '–' : v.toFixed(d);
const sgn = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const pct = (p) => Math.round(p * 100) + '%';
const odds = (o) => o == null ? '–' : (o > 0 ? '+' + o : String(o));
const half = (v) => Math.round(v * 2) / 2;
const bookSpread = (team, homeFav) => team + ' ' + (homeFav === 0 ? 'PK' : (homeFav > 0 ? '−' : '+') + Math.abs(homeFav));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1600); }

function updatedText(iso) {
  if (!iso) return 'recently';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' at ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
$('#stamp').innerHTML = `${META.label} · ${META.seasonLabel || DATA.season} regular season · stats through <b>${DAILY ? shortDate(dateOfW[lastDone]) : 'Week ' + lastDone}</b> (${completed.length} games)${META.note ? ' · ' + esc(META.note) : ''} · stats, schedule and lines from ${esc(META.source)}, updated ${updatedText(DATA.updated)}. Lines move, so check your book before you trust an edge.`;

// ---------- builder ----------
function renderBuilder() {
  $('#presets').innerHTML = Object.keys(E.PRESETS).map((n) => {
    const on = E.FACTORS.every((f) => E.PRESETS[n][f.key] === S.weights[f.key]);
    return `<button class="chip" data-preset="${esc(n)}" aria-pressed="${on}">${esc(n)}</button>`;
  }).join('');
  $('#sliders').innerHTML = E.FACTORS.map((f) => `
    <label class="sl" for="w-${f.key}"><span class="nm">${f.label}</span><span class="val" id="wv-${f.key}">${S.weights[f.key]}</span>
      <span class="hint">${f.hint}</span>
      <input type="range" id="w-${f.key}" data-w="${f.key}" min="0" max="10" step="1" value="${S.weights[f.key]}"></label>`).join('');
  const st = [
    { k: 'hfa', nm: META.family === 'hockey' ? 'Home-ice edge' : META.family === 'basketball' ? 'Home-court edge' : 'Home-field edge', hint: 'Added to the home team, in ' + UNIT, min: 0, max: META.hfaMax ?? 4, step: META.hfaStep ?? 0.5, show: (v) => v + ' ' + UNIT },

// ---------- model state for the selected week ----------
function model() {
  const before = Math.min(S.week, lastDone + 1);

}
function linesFor(g) {

// Line movement: where the line opened vs now, and whether it moved toward the model.
function moveNote(g, k, L, pr) {

  const target = k === 'sp' ? pr.margin : pr.total;
  const toward = Math.abs(target - now) < Math.abs(target - o);
  const fmtL = (v) => k === 'sp' ? (v === 0 ? 'PK' : (v > 0 ? '−' : '+') + Math.abs(v)) : v;
  return `<span class="move ${toward ? 'yes' : 'no'}" title="${toward ? 'The market has moved toward your model since it opened' : 'The market has moved away from your model since it opened'}">opened ${esc(String(fmtL(o)))} ${toward ? '↗ toward you' : '↘ away'}</span>`;
}

// ---------- props ----------
const DEF = E.defenseAllowed(DATA);
const lastWeekByTeam = {}; DATA.teamGames.forEach((r) => { lastWeekByTeam[r.t] = Math.max(lastWeekByTeam[r.t] || 0, r.w); });
const playerGames = {}; DATA.players.forEach((r) => { (playerGames[r.id] || (playerGames[r.id] = [])).push(r); });
function propRows() {
  const weekGames = DATA.games.filter((g) => g.w === S.week);
  const opp = {}; const gameOf = {};
  weekGames.forEach((g) => { opp[g.h] = g.a; opp[g.a] = g.h; gameOf[g.h] = g; gameOf[g.a] = g; });
  const out = [];
  Object.entries(playerGames).forEach(([id, games]) => {
    games.sort((a, b) => a.w - b.w);
    const team = games[games.length - 1].t;
    if (!opp[team] || games.length < 2) return;
    if (games[0].p !== 'G' && games[games.length - 1].w !== lastWeekByTeam[team]) return; // didn't play in team's last game
    if (S.propPos !== 'all' && games[0].p !== S.propPos) return;
    const prop = E.propOf(S.propKey); if (!prop || !prop.pos.includes(games[0].p)) return;
    if (!prop.elig(games)) return;
    if (games[0].p === 'G') { // goalie props: only tonight's projected starter
      const gm = gameOf[team], side = gm.h === team ? 'hg' : 'ag', ov = (S.lines[gm.id] || {})[side];
      if ('G' + (ov || gm[side]) !== id) return;
    }
    if (S.propQ && !games[0].n.toLowerCase().includes(S.propQ.toLowerCase())) return;
    const pj = E.projectProp(games, S.propKey, opp[team], DEF, { recent: S.recent, matchup: S.matchup });
    if (!pj) return;
    const saved = S.props[id + '|' + S.propKey] || {};
    const row = { id, name: games[0].n, pos: games[0].p, team, opp: opp[team], home: gameOf[team].h === team, pj, line: saved.line, odds: saved.odds ?? -110 };
    if (row.line != null && row.line !== '') {
      const po = E.overProb(pj, +row.line);
      row.pOver = po; row.side = po >= 0.5 ? 'Over' : 'Under';
      row.p = Math.max(po, 1 - po); row.ev = E.evPerUnit(row.p, +row.odds || -110);
    }
    out.push(row);
  });
  out.sort((a, b) => (b.ev ?? -9) - (a.ev ?? -9) || b.pj.proj - a.pj.proj);
  return out;
}

}

  </div>
  <p class="note" style="margin:0 0 12px">Projection = season average blended with the last 3 games, then nudged by what the opponent allows to that position. Type your book's line and odds to get the over/under probability and value. Lines you enter are kept in this browser (${board} entered). This data doesn't know about injuries, so check the report before you trust a projection.</p>
  <div class="tblwrap"><table>
    <thead><tr><th>Player</th><th>Matchup</th><th class="num">Proj</th><th class="num">Season</th><th class="num">Last 3</th><th>Game log</th><th class="num" title="Opponent allows vs league average">Opp D</th><th>Line</th><th>Odds</th><th>Lean</th><th></th></tr></thead>

      <td>${spark(r.pj.vals)}</td>
      <td class="num"><span class="pill ${r.pj.matchup > 1.08 ? 'good' : r.pj.matchup < 0.92 ? 'bad' : 'flat'}" title="Allows ${Math.round(r.pj.matchup * 100)}% of league average">${Math.round(r.pj.matchup * 100)}%</span></td>
      <td><input type="number" step="0.5" aria-label="Line for ${esc(r.name)}" id="pl-${r.id}" data-pline="${r.id}" value="${r.line ?? ''}" placeholder="${half(r.pj.season)}"></td>
      <td><input type="number" step="5" aria-label="Odds for ${esc(r.name)}" id="po-${r.id}" data-podds="${r.id}" value="${r.odds}"></td>
      <td>${r.ev == null ? '<span class="muted small">enter line</span>' : `${evPill(r.ev)} <span class="small">${r.side} ${pct(r.p)}</span>`}</td>

    </tr>`).join('') || `<tr><td colspan="11" class="muted">No players match. Try another position or clear the search.</td></tr>`}</tbody>
  </table></div>
  ${rows.length > shown.length ? `<p class="note">Showing the top ${shown.length} of ${rows.length}. Search a name to find anyone else.</p>` : ''}`;
}

// ---------- rankings ----------
function rankingsView() {
  const { P, R } = model();
  const list = Object.keys(R.rating).map((t) => ({ t, r: R.rating[t], p: P[t], c: R.contrib[t] })).sort((a, b) => b.r - a.r);
  const max = Math.max(...list.map((x) => Math.abs(x.r)), 1);
  const lbl = Object.fromEntries(E.FACTORS.map((f) => [f.key, f.label.toLowerCase()])); lbl.prior = 'preseason rating';
  return `<p class="note" style="margin:0 0 12px">Points better or worse than an average team on a neutral field, using your weights. The line under each team names what's driving its rating most.</p>
  <div class="rank">${list.map((x, i) => {
    const w = Math.abs(x.r) / max * 50;
    const drivers = Object.entries(x.c).filter(([, v]) => Math.abs(v) > 0.05).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 2)
      .map(([k, v]) => `${lbl[k]} ${sgn(v)}`).join(' · ');
    return `<div class="rr" title="${x.t}: ${x.p.n} games, ${fmt(x.p.pf)} PF / ${fmt(x.p.pa)} PA per game">
      <span class="muted">${i + 1}</span><span class="t">${x.t}</span>
      <span class="bar"><span style="${x.r >= 0 ? `left:50%;width:${w}%;background:var(--pos);border-radius:0 4px 4px 0` : `right:50%;width:${w}%;background:var(--neg);border-radius:4px 0 0 4px`}"></span></span>
      <span style="text-align:right;font-weight:600">${sgn(x.r)}</span>
      <span class="drv">${drivers || 'average across the board'}</span></div>`;
  }).join('')}</div>`;
}

// ---------- accuracy ----------
function accuracyView() {
  const bt = E.backtest(DATA, S.weights, S.settings, S.btEdge);
  const atsN = bt.ats[0] + bt.ats[1], ouN = bt.ou[0] + bt.ou[1];
  const rec = (a) => `${a[0]}–${a[1]}${a[2] ? '–' + a[2] : ''}`;
  const perRaw = bt.per.map((p) => {
    const vg = DATA.games.filter((g) => g.w === p.w && g.hs != null && g.sp && g.hs !== g.as_);
    const vegasRight = vg.filter((g) => (g.sp > 0) === (g.hs > g.as_)).length;
    return { ...p, vr: vegasRight, vn: vg.length };
  });
  let per = perRaw;
  if (DAILY) { // group days into weeks
    const wk = {};
    perRaw.forEach((p) => { const k = Math.floor(p.w / 7); const o = wk[k] || (wk[k] = { w: p.w, su: 0, n: 0, vr: 0, vn: 0 }); o.su += p.su; o.n += p.n; o.vr += p.vr; o.vn += p.vn; });
    per = Object.values(wk);
  }
  per = per.map((p) => ({ ...p, mp: p.n ? p.su / p.n : 0, vp: p.vn ? p.vr / p.vn : 0 }));
  const savedRows = S.saved.map((m) => { const b = E.backtest(DATA, m.weights, m.settings, S.btEdge); return { m, b }; });
  return `
  <p class="note" style="margin:0 0 14px">${DAILY ? 'Each day' : 'Each week'} is predicted using only the games before it, so the model never sees the answer. Compared against the closing line for the same games${META.family === 'hockey' || META.family === 'baseball' ? ' (lines are only on file from when this site started saving them)' : ''}. ${completed.length < 400 ? completed.length + ' games is a small sample: a few lucky ' + (DAILY ? 'days' : 'weeks') + ' can swing these a lot.' : ''}</p>
  <div class="tiles">
    <div class="tile"><span class="label">Winners picked</span><b>${bt.n ? pct(bt.su / bt.n) : '–'}</b><span class="sub">${bt.su} of ${bt.n} · Vegas favorite ${bt.vegasN ? pct(bt.vegasSu / bt.vegasN) : '–'}</span></div>
    <div class="tile"><span class="label">Against the spread</span><b>${atsN ? pct(bt.ats[0] / atsN) : '–'}</b><span class="sub">${rec(bt.ats)} · 52.4% breaks even at −110</span></div>
    <div class="tile"><span class="label">Over / under</span><b>${ouN ? pct(bt.ou[0] / ouN) : '–'}</b><span class="sub">${rec(bt.ou)}</span></div>
    <div class="tile"><span class="label">Average miss</span><b>${fmt(bt.mae)}</b><span class="sub">${UNIT === 'pts' ? 'points' : UNIT} off the final margin${bt.vegasN ? ' · Vegas ' + fmt(bt.vegasMae) : ''}</span></div>
  </div>
  <div class="toolbar"><div class="f"><label class="label" for="btEdge">Only count spread and total plays with an edge of</label>
    <select id="btEdge">${[0, ...EDGE_STEPS].map((v) => `<option value="${v}" ${v === S.btEdge ? 'selected' : ''}>${v ? v + '+ ' + UNIT : 'Any edge'}</option>`).join('')}</select></div></div>
  <div class="wk">
    <h3 style="font-size:20px;text-transform:uppercase;margin-bottom:8px">Winners picked by week${DAILY ? ' (week starting)' : ''}</h3>${per.length > 12 ? '<div class="note" style="margin:-4px 0 8px">Latest 12 weeks</div>' : ''}
    <div class="legend"><span><i style="background:var(--accent)"></i>Your model</span>${per.some((p) => p.vn) ? '<span><i style="background:var(--vegas)"></i>Vegas favorite</span>' : ''}</div>
    <div class="wkrows">${per.slice(-12).map((p) => `<div class="wkr"><span class="label">${DAILY ? shortDate(dateOfW[p.w]) : 'Week ' + p.w}</span>
      <div class="wkbars" style="padding-right:88px">
        <div style="width:${p.mp * 100}%;background:var(--accent)" title="Model: ${p.su} of ${p.n}"><span>${pct(p.mp)} · ${p.su}/${p.n}</span></div>
        ${p.vn ? `<div style="width:${p.vp * 100}%;background:var(--vegas)" title="Vegas: ${p.vr} of ${p.vn}"><span>${pct(p.vp)}</span></div>` : ''}
      </div></div>`).join('')}</div>
  </div>
  ${battleView()}
  <h3 style="font-size:20px;text-transform:uppercase;margin-bottom:8px">Saved models compared</h3>
  ${savedRows.length ? `<div class="tblwrap"><table><thead><tr><th>Model</th><th class="num">Winners</th><th class="num">ATS</th><th class="num">O/U</th><th class="num">Avg miss</th></tr></thead><tbody>
    ${savedRows.map(({ m, b }) => `<tr><td class="pname">${esc(m.name)}</td><td class="num">${b.su}/${b.n} (${pct(b.su / b.n)})</td><td class="num">${rec(b.ats)}</td><td class="num">${rec(b.ou)}</td><td class="num">${fmt(b.mae)}</td></tr>`).join('')}
  </tbody></table></div>` : `<div class="empty">Save a model from the panel on the left to compare versions here.</div>`}`;
}

// ---------- model battles ----------
function battleModels() {
  return [{ id: 'current', name: 'Current sliders', weights: S.weights, settings: S.settings }, ...S.saved.map((m, i) => ({ id: 's' + i, name: m.name, weights: m.weights, settings: { ...SPORT_DEFAULTS, ...m.settings } })),
    ...Object.keys(E.PRESETS).map((n) => ({ id: 'p:' + n, name: n + ' (preset)', weights: E.PRESETS[n], settings: S.settings }))];
}
function battleView() {
  const ms = battleModels();
  if (!S.battleB) S.battleB = (ms.find((m) => m.id !== S.battleA && m.id.startsWith('s')) || ms.find((m) => m.id !== S.battleA)).id;
  const A = ms.find((m) => m.id === S.battleA) || ms[0], B = ms.find((m) => m.id === S.battleB) || ms[1];
  const sel = (id, cur) => `<select id="${id}">${ms.map((m) => `<option value="${m.id}" ${m.id === cur ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`;
  const a = E.backtest(DATA, A.weights, A.settings, 0, true), b = E.backtest(DATA, B.weights, B.settings, 0, true);
  const bm = Object.fromEntries(b.picks.map((x) => [x.id, x]));
  let su = [0, 0, 0], ats = [0, 0, 0];
  const byW = {};
  a.picks.forEach((x) => {
    const y = bm[x.id]; if (!y || x.res === 0) return;
    const wk = DAILY ? Math.floor(x.w / 7) : x.w; const o = byW[wk] || (byW[wk] = { w: x.w, a: 0, b: 0 });
    if ((x.m > 0) !== (y.m > 0)) { su[2]++; if ((x.m > 0) === (x.res > 0)) { su[0]++; o.a++; } else { su[1]++; o.b++; } }
    if (x.sp != null && (x.m > x.sp) !== (y.m > y.sp) && x.res !== x.sp) { ats[2]++; if ((x.m > x.sp) === (x.res > x.sp)) ats[0]++; else ats[1]++; }
  });
  const weeks = Object.values(byW).filter((o) => o.a + o.b);
  const lead = su[0] === su[1] ? 'Dead even' : (su[0] > su[1] ? esc(A.name) : esc(B.name)) + ' leads';
  return `<div class="wk"><h3 style="font-size:20px;text-transform:uppercase;margin-bottom:8px">Model battle</h3>
    <div class="toolbar" style="margin-bottom:10px"><div class="f"><label class="label" for="battleA">Model A</label>${sel('battleA', A.id)}</div>
      <div class="f"><label class="label" for="battleB">Model B</label>${sel('battleB', B.id)}</div></div>
    <p class="note" style="margin:0 0 10px">Only games where the two models disagreed count; those are the games that decide which one is better.</p>
    <div class="tiles" style="margin-bottom:10px">
      <div class="tile"><span class="label">Picking winners</span><b>${su[0]}–${su[1]}</b><span class="sub">${lead} · ${su[2]} disagreements</span></div>
      <div class="tile"><span class="label">Against the line</span><b>${ats[2] ? ats[0] + '–' + ats[1] : '–'}</b><span class="sub">${ats[2] ? 'A–B when they took opposite sides' : 'no saved lines to compare'}</span></div>
      <div class="tile"><span class="label">Average miss</span><b>${fmt(a.mae)} / ${fmt(b.mae)}</b><span class="sub">A / B, ${UNIT === 'pts' ? 'points' : UNIT}</span></div>
    </div>
    ${weeks.length ? `<div class="small muted">${weeks.slice(-10).map((o) => `${DAILY ? shortDate(dateOfW[o.w]) : 'Wk ' + o.w}: <b style="color:var(--ink)">${o.a}–${o.b}</b>`).join(' · ')}</div>` : ''}
  </div>`;
}

// ---------- pick log ----------
function gradePick(p) {
  const units = (o) => E.profitPerUnit(o);
  if (p.type === 'prop') {
    const r = DATA.players.find((x) => x.id === p.pid && x.w === p.w);
    const done = DATA.games.some((g) => g.w === p.w && g.hs != null && (g.h === p.team || g.a === p.team));
    if (!done) return null;
    if (!r) return { res: 'void', u: 0, note: 'did not play' };
    const v = E.statOf(r, p.key); if (v === p.line) return { res: 'push', u: 0, note: v };
    const win = p.side === 'Over' ? v > p.line : v < p.line; return { res: win ? 'win' : 'loss', u: win ? units(p.odds) : -1, note: v };
  }
  const g = DATA.games.find((x) => x.id === p.gid); if (!g || g.hs == null) return null;
  const res = g.hs - g.as_; let d;
  if (p.type === 'spread') d = p.side === g.h ? res - p.line : -(res - p.line);
  if (p.type === 'total') d = p.side === 'Over' ? (g.hs + g.as_) - p.line : p.line - (g.hs + g.as_);
  if (p.type === 'ml') d = p.side === g.h ? res : -res;
  const note = `${g.a} ${g.as_}–${g.hs} ${g.h}`;
  if (d === 0) return { res: 'push', u: 0, note };
  return { res: d > 0 ? 'win' : 'loss', u: d > 0 ? units(p.odds) : -1, note };
}
function logView() {
  if (!S.picks.length) return `<div class="empty">No picks logged yet. Hit <b>Log</b> next to any spread, total, moneyline or player prop and it lands here. Once those games are in the data, each pick is graded automatically.</div>`;
  const g = S.picks.map((p) => ({ p, gr: gradePick(p) }));
  const done = g.filter((x) => x.gr && x.gr.res !== 'void');
  const w = done.filter((x) => x.gr.res === 'win').length, l = done.filter((x) => x.gr.res === 'loss').length, pu = done.filter((x) => x.gr.res === 'push').length;
  const u = done.reduce((s, x) => s + x.gr.u, 0);
  return `<div class="tiles">
    <div class="tile"><span class="label">Record</span><b>${w}–${l}${pu ? '–' + pu : ''}</b><span class="sub">${g.length - done.length} pending</span></div>
    <div class="tile"><span class="label">Units</span><b style="color:${u > 0 ? 'var(--good)' : u < 0 ? 'var(--bad)' : 'inherit'}">${u >= 0 ? '+' : '−'}${Math.abs(u).toFixed(2)}</b><span class="sub">1 unit risked per pick</span></div>
  </div>
  <div class="tblwrap"><table><thead><tr><th>${DAILY ? 'Date' : 'Wk'}</th><th>Pick</th><th>Odds</th><th>Model said</th><th>Model</th><th>Result</th><th></th></tr></thead><tbody>
  ${g.slice().reverse().map(({ p, gr }) => `<tr><td>${DAILY ? shortDate(dateOfW[p.w]) : p.w}</td><td class="pname">${esc(p.desc)}</td><td>${odds(p.odds)}</td><td class="small">${esc(p.why)}</td><td class="small muted">${esc(p.model)}</td>
    <td>${gr ? `<span class="pill ${gr.res === 'win' ? 'good' : gr.res === 'loss' ? 'bad' : 'flat'}">${gr.res}</span> <span class="small muted">${esc(gr.note)}</span>` : '<span class="pill flat">pending</span>'}</td>
    <td><button class="x logbtn" data-unlog="${p.ts}" aria-label="Remove pick">✕</button></td></tr>`).join('')}
  </tbody></table></div>
  <p class="note">${S.confirmClear ? `<span class="confirm">Remove all ${S.picks.length} picks? <button class="btn accent" id="clearYes">Remove all</button><button class="btn ghost" id="clearNo">Keep</button></span>` : `<button class="btn ghost" id="clearLog">Clear log</button>`} Picks are saved in this browser only.</p>`;
}
function currentModelName() {
  const m = S.saved.find((x) => E.FACTORS.every((f) => x.weights[f.key] === S.weights[f.key]));
  if (m) return m.name;
  const p = Object.keys(E.PRESETS).find((n) => E.FACTORS.every((f) => E.PRESETS[n][f.key] === S.weights[f.key]));
  return p || 'Custom';
}
function logGamePick(type, gid, side) {
  const g = DATA.games.find((x) => x.id === gid); const L = linesFor(g);
  const { P, R } = model(); const pr = E.predict(g, P, R, S.settings, L, DATA);
  let desc, line, o, why;
  if (type === 'spread') { line = L.sp; desc = side === g.h ? bookSpread(g.h, L.sp) : bookSpread(g.a, -L.sp); o = (side === g.h ? L.hspp : L.aspp) ?? -110; why = `model ${bookSpread(g.h, half(pr.margin))}`; }
  if (type === 'total') { line = L.tot; desc = `${g.a}/${g.h} ${side} ${L.tot}`; o = (side === 'Over' ? L.ovp : L.unp) ?? -110; why = `model total ${fmt(pr.total)}`; }
  if (type === 'ml') { o = side === g.h ? L.hml : L.aml; desc = `${side} ML`; why = `${pct(side === g.h ? pr.pHome : pr.pAway)} to win`; }
  S.picks.push({ ts: Date.now(), type, gid, side, line, odds: o, w: g.w, desc: desc + (type !== 'total' ? ` (${g.a}@${g.h})` : ''), why, model: currentModelName() });
  store.set('picks', S.picks); renderTabs(); toast('Logged ' + desc);
}
function logPropPick(pid, side) {
  const r = propRows().find((x) => x.id === pid); if (!r) return;
  const prop = E.PROPS.find((p) => p.key === S.propKey);
  S.picks.push({ ts: Date.now(), type: 'prop', pid, key: S.propKey, side, line: +r.line, odds: +r.odds || -110, w: S.week, team: r.team,
    desc: `${r.name} ${side} ${r.line} ${prop.label.toLowerCase()}`, why: `proj ${fmt(r.pj.proj)} · ${pct(r.p)}`, model: 'Props' });
  store.set('picks', S.picks); renderTabs(); toast('Logged ' + r.name + ' ' + side);
}

// ---------- view wiring ----------
function renderView() {
  const v = { games: gamesView, props: propsView, rankings: rankingsView, accuracy: accuracyView, log: logView }[S.tab] || gamesView;
  const focus = document.activeElement && document.activeElement.id; const pos = focus && document.activeElement.selectionStart;
  $('#view').innerHTML = v();
  if (focus && $('#view').querySelector('#' + CSS.escape(focus))) { const el = document.getElementById(focus); el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} }
}
$('#view').addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'weekSel') { S.week = +t.value; renderView(); }
  if (t.id === 'sortSel') { S.sort = t.value; renderView(); }
  if (t.id === 'edgeMin') { S.edgeMin = +t.value; renderView(); }
  if (t.id === 'onlyEdges') { S.onlyEdges = t.checked; renderView(); }
  if (t.id === 'propKey') { S.propKey = t.value; S.propPos = 'all'; renderView(); }
  if (t.id === 'propPos') { S.propPos = t.value; renderView(); }
  if (t.id === 'btEdge') { S.btEdge = +t.value; renderView(); }
  if (t.id === 'battleA') { S.battleA = t.value; renderView(); }
  if (t.id === 'battleB') { S.battleB = t.value; renderView(); }
  if (t.dataset.line) {
    const g = t.dataset.g, k = t.dataset.line, o = S.lines[g] || (S.lines[g] = {});
    const v = t.value === '' ? null : +t.value; o[k] = k === 'sp' && v != null ? -v : v;
    store.set('lines', S.lines); renderView();
  }
  if (t.dataset.goalie) {
    const o = S.lines[t.dataset.g] || (S.lines[t.dataset.g] = {});
    o[t.dataset.goalie] = t.value || undefined; store.set('lines', S.lines); renderView();
  }
  if (t.dataset.pline || t.dataset.podds) {
    const id = t.dataset.pline || t.dataset.podds, key = id + '|' + S.propKey; const o = S.props[key] || (S.props[key] = {});
    if (t.dataset.pline) o.line = t.value === '' ? null : +t.value; else o.odds = t.value === '' ? -110 : +t.value;
    store.set('props', S.props); renderView();
  }
});
$('#view').addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'propQ') { S.propQ = t.value; renderView(); }
  if (t.id === 'teamQ') { S.teamQ = t.value; renderView(); }
  if (t.id === 'recent' || t.id === 'matchupW') { // update label live; recompute when released
    const lab = document.querySelector('label[for="' + t.id + '"]');
    if (lab) lab.textContent = (t.id === 'recent' ? 'Recent games weight · ' : 'Matchup weight · ') + t.value + '%';
  }
});
$('#view').addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'recent') { S.recent = +t.value; renderView(); }
  if (t.id === 'matchupW') { S.matchup = +t.value; renderView(); }
});
$('#view').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.log) logGamePick(b.dataset.log, b.dataset.g, b.dataset.side);
  if (b.dataset.logprop) logPropPick(b.dataset.logprop, b.dataset.side);
  if (b.dataset.unlog) { S.picks = S.picks.filter((p) => String(p.ts) !== b.dataset.unlog); store.set('picks', S.picks); renderTabs(); renderView(); }
  if (b.id === 'clearLog') { S.confirmClear = true; renderView(); }
  if (b.id === 'clearNo') { S.confirmClear = false; renderView(); }
  if (b.id === 'clearYes') { S.picks = []; S.confirmClear = false; store.set('picks', S.picks); renderTabs(); renderView(); toast('Log cleared'); }
});

document.body.classList.add('sport-' + META.sport);
renderBuilder(); renderTabs(); renderView();
}

function sportDefaults(m) {
  return { hfa: m.hfa ?? 1.5, trust: m.trust ?? 60, bye: m.bye ?? 1, prior: m.priorGames ?? 0, weather: m.weather ? 5 : 0, qbOut: m.qbOut ? 5 : 0, goalie: m.goalie ? 5 : 0 };
}
const SPORTS = [
  { key: 'edges', label: 'Best edges' },
  { key: 'nfl', label: 'NFL' },
  { key: 'cfb', label: 'College football' },
  { key: 'nhl', label: 'NHL' },
  { key: 'cbb', label: 'College basketball' },
  { key: 'mlb', label: 'MLB' },
];
function chosenSport() {
  const h = location.hash.slice(1);
  if (SPORTS.some((s) => s.key === h && !s.soon)) return h;
  try { const v = localStorage.getItem('gml:sport'); if (SPORTS.some((s) => s.key === v && !s.soon)) return v; } catch (e) {}
  return 'nfl';
}
const SPORT = chosenSport();
document.getElementById('sports').innerHTML = SPORTS.map((s) => s.soon
  ? `<span class="sport soon" title="Coming soon">${s.label}<small>soon</small></span>`
  : `<button class="sport" data-sport="${s.key}" aria-pressed="${s.key === SPORT}">${s.label}</button>`).join('');
document.getElementById('sports').addEventListener('click', (e) => {
  const b = e.target.closest('[data-sport]'); if (!b || b.dataset.sport === SPORT) return;
  try { localStorage.setItem('gml:sport', b.dataset.sport); } catch (err) {}
  location.hash = b.dataset.sport; location.reload();
});

// ---------- best edges across every sport ----------
async function bootEdges() {
  const E = window.Engine;
  const $ = (q) => document.querySelector(q);
  const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.body.classList.add('sport-edges');
  $('aside.builder').hidden = true; $('#tabs').hidden = true; $('.layout').classList.add('solo');
  $('#stamp').textContent = 'Every sport in one place: the biggest edges in the next couple of days, scored with the model you saved for each sport.';
  $('#view').innerHTML = '<div class="empty">Scoring every game…</div>';
  const status = await fetch('data/status.json', { cache: 'no-cache' }).then((r) => r.json()).catch(() => ({}));
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
  const plus = (n) => { const d = new Date(today + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const keys = SPORTS.filter((x) => x.key !== 'edges' && !(status[x.key] && (status[x.key].ok === false || (status[x.key].next !== undefined && (!status[x.key].next || status[x.key].next > plus(6)))))).map((x) => x.key);
  const rows = [], counts = {};
  for (const key of keys) {
    let data; try { data = await fetch('data/' + key + '.json', { cache: 'no-cache' }).then((r) => r.json()); } catch (e) { continue; }
    const m = data.meta; E.configure(m);
    const pre = key === 'nfl' ? 'gml:' : 'gml:' + key + ':';
    const get = (k, d) => { try { const v = localStorage.getItem(pre + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
    const weights = get('weights', { ...E.PRESETS.Balanced }), settings = { ...sportDefaults(m), ...get('settings', {}) }, over = get('lines', {});
    const done = data.games.filter((g) => g.hs != null), lastDone = done.length ? Math.max(...done.map((g) => g.w)) : 0;
    let upcoming = data.games.filter((g) => g.hs == null && g.d && g.d >= today);
    if (m.period === 'Day') upcoming = upcoming.filter((g) => g.d <= plus(1));
    else { const w = Math.min(...upcoming.map((g) => g.w)); upcoming = upcoming.filter((g) => g.w === w && g.d <= plus(6)); }
    if (!upcoming.length) continue;
    const P = E.teamProfiles(data, lastDone + 1), R = E.ratings(P, weights, settings);
    const unit = m.unit || 'pts', min = m.edgeDefault ?? 1.5;
    const book = (t, v) => t + ' ' + (v === 0 ? 'PK' : (v > 0 ? '−' : '+') + Math.abs(v));
    counts[key] = 0;
    upcoming.forEach((g) => {
      const o = over[g.id] || {}; const L = {};
      ['sp', 'tot', 'hml', 'aml', 'hg', 'ag'].forEach((k) => { L[k] = o[k] !== undefined ? o[k] : g[k]; });
      const pr = E.predict(g, P, R, settings, L, data); if (!pr) return;
      const base = { sport: key, label: m.label, g, when: g.d + ' ' + (g.tm || '') };
      // Market chance with the bookmaker's cut removed, from both sides' prices.
      const fair = (mine, theirs) => { const a = E.impliedProb(mine ?? -110), b = E.impliedProb(theirs ?? -110); return a / (a + b); };
      const fixedLine = m.family === 'hockey' || m.family === 'baseball'; // puck/run lines are never priced at -110
      const add = (type, bet, p, price, other, edge) => {
        if (type === 'Moneyline' && price > 250) return;      // skip long shots
        if (fixedLine && type !== 'Moneyline' && price == null) return;
        const pm = fair(price, other), pb = (p + pm) / 2; // 50/50 blend of your model and the market
        const ev = E.evPerUnit(pb, price ?? -110);
        if (ev > 0.015) rows.push({ ...base, type, bet: bet + (price != null && price !== -110 ? ' (' + (price > 0 ? '+' + price : price) + ')' : ''), p, pm, ev, edge });
      };
      if (pr.spEdge != null && Math.abs(pr.spEdge) >= min) {
        const home = pr.spEdge > 0;
        add(m.spreadName || 'Spread', home ? book(g.h, L.sp) : book(g.a, -L.sp), home ? pr.pHomeCover : 1 - pr.pHomeCover,
          home ? L.hspp : L.aspp, home ? L.aspp : L.hspp, Math.abs(pr.spEdge).toFixed(1) + ' ' + unit);
      }
      if (pr.totEdge != null && Math.abs(pr.totEdge) >= min) {
        const ov = pr.totEdge > 0;
        add('Total', (ov ? 'Over ' : 'Under ') + L.tot, ov ? pr.pOver : 1 - pr.pOver, ov ? L.ovp : L.unp, ov ? L.unp : L.ovp, Math.abs(pr.totEdge).toFixed(1) + ' ' + unit);
      }
      if (L.hml != null && L.aml != null) {
        add('Moneyline', g.h, pr.pHome, L.hml, L.aml, Math.round(pr.pHome * 100) + '% to win');
        add('Moneyline', g.a, pr.pAway, L.aml, L.hml, Math.round(pr.pAway * 100) + '% to win');
      }
    });
    counts[key] = rows.filter((r) => r.sport === key).length;
  }
  rows.sort((a, b) => b.ev - a.ev);
  const when = (r) => { const d = new Date(r.g.d + 'T12:00:00'); const day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); if (!r.g.tm) return day; const [h, mi] = r.g.tm.split(':').map(Number); return day + ' · ' + ((h % 12) || 12) + ':' + String(mi).padStart(2, '0') + (h >= 12 ? 'p' : 'a'); };
  const chips = Object.entries(counts).map(([k, n]) => `<span class="pill flat">${esc(SPORTS.find((x) => x.key === k).label)} ${n}</span>`).join(' ');
  $('#view').innerHTML = rows.length ? `
    <div class="toolbar"><div class="small muted">${chips || ''}</div></div>
    <div class="tblwrap"><table><thead><tr><th>Sport</th><th>Game</th><th>When</th><th>Bet</th><th class="num">Model vs market</th><th class="num">Edge</th><th class="num">Value</th><th></th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr ${i >= 25 ? 'class="more" hidden' : ''}><td><span class="pill flat">${esc(r.label)}</span></td><td class="pname">${esc(r.g.a)} @ ${esc(r.g.h)}</td><td class="small">${when(r)}</td>
      <td><b>${esc(r.bet)}</b> <span class="muted small">${esc(r.type)}</span></td><td class="num">${Math.round(r.p * 100)}% <span class="muted small">vs ${Math.round(r.pm * 100)}%</span></td><td class="num">${esc(r.edge)}</td>
      <td class="num"><span class="pill ${r.ev > 0.03 ? 'good' : 'flat'}">EV ${r.ev >= 0 ? '+' : '−'}${Math.abs(r.ev * 100).toFixed(0)}%</span></td>
      <td><button class="logbtn" data-open="${r.sport}">Open</button></td></tr>`).join('')}
    </tbody></table></div>
    ${rows.length > 25 ? `<p><button class="btn ghost" id="showAll">Show all ${rows.length}</button></p>` : ''}
    <p class="note">Value uses a 50/50 blend of your model and the market's fair price, so long-shot underdogs don't flood the list just because the model is less extreme than the odds. Moneylines longer than +250 are left out. Uses real prices when the feed has them (−110 otherwise), each sport's saved sliders, and any lines you typed in.</p>`
    : `<div class="empty">No edges in the next couple of days with your current models. Try lowering the edge threshold in a sport, or check back after the next data refresh.</div>`;
  $('#view').addEventListener('click', (e) => {
    if (e.target.id === 'showAll') { document.querySelectorAll('tr.more').forEach((r) => { r.hidden = false; }); e.target.remove(); return; }
    const b = e.target.closest('[data-open]'); if (!b) return;
    try { localStorage.setItem('gml:sport', b.dataset.open); } catch (err) {}
    location.hash = b.dataset.open; location.reload();
  });
}

// ---------- sync across devices (a private GitHub Gist on your account) ----------
const Sync = (() => {
  const API = 'https://api.github.com', DESC = '5ive Lab sync', FILE = '5ive-lab-sync.json';
  const ls = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  const token = () => ls.get('gml_sync_token');
  const tsMap = () => { try { return JSON.parse(ls.get('gml_sync_ts') || '{}'); } catch (e) { return {}; } };
  let timer = 0, state = token() ? 'on' : 'off', lastMsg = '';
  const synced = (k) => k.startsWith('gml:') && !/^gml:(sport|tab)$/.test(k) && !/:tab$/.test(k);
  const headers = () => ({ Authorization: 'Bearer ' + token(), Accept: 'application/vnd.github+json' });
  async function gistId() {
    let id = ls.get('gml_sync_gist'); if (id) return id;
    for (let page = 1; page <= 5; page++) {
      const r = await fetch(`${API}/gists?per_page=100&page=${page}`, { headers: headers() });
      if (!r.ok) throw new Error(r.status === 401 ? 'GitHub rejected the token' : 'GitHub error ' + r.status);
      const list = await r.json();
      const hit = list.find((g) => g.description === DESC && g.files && g.files[FILE]);
      if (hit) { ls.set('gml_sync_gist', hit.id); return hit.id; }
      if (list.length < 100) break;
    }
    const r = await fetch(`${API}/gists`, { method: 'POST', headers: headers(), body: JSON.stringify({ description: DESC, public: false, files: { [FILE]: { content: '{"v":1,"ts":{},"data":{}}' } } }) });
    if (!r.ok) throw new Error(r.status === 403 || r.status === 404 ? 'The token needs Gists read and write permission' : 'GitHub error ' + r.status);
    const g = await r.json(); ls.set('gml_sync_gist', g.id); return g.id;
  }
  function snapshot() {
    const data = {}, ts = tsMap();
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (synced(k)) data[k] = ls.get(k); }
    return { v: 1, ts, data };
  }
  function merge(remote) { // newer value wins per setting; pick logs are combined
    const local = tsMap(); let changed = false;
    Object.entries(remote.data || {}).forEach(([k, v]) => {
      if (!synced(k)) return;
      const rt = (remote.ts || {})[k] || 0, lt = local[k] || 0, cur = ls.get(k);
      if (/(^|:)picks$/.test(k) && cur && v && cur !== v) {
        try {
          const a = JSON.parse(cur), b = JSON.parse(v), seen = new Set(a.map((p) => p.ts));
          const all = a.concat(b.filter((p) => !seen.has(p.ts))).sort((x, y) => x.ts - y.ts);
          const out = JSON.stringify(all); if (out !== cur) { ls.set(k, out); changed = true; }
          local[k] = Math.max(rt, lt); return;
        } catch (e) {}
      }
      if (rt > lt || cur == null) { if (cur !== v) { ls.set(k, v); changed = true; } local[k] = rt; }
    });
    ls.set('gml_sync_ts', JSON.stringify(local));
    return changed;
  }
  async function pull() {
    if (!token()) return false;
    try {
      const id = await gistId();
      const r = await fetch(`${API}/gists/${id}`, { headers: headers(), cache: 'no-store' });
      if (r.status === 404) { ls.set('gml_sync_gist', ''); return pull(); }
      if (!r.ok) throw new Error('GitHub error ' + r.status);
      const g = await r.json(); const f = g.files && g.files[FILE];
      let content = f && f.content; if (f && f.truncated) content = await (await fetch(f.raw_url)).text();
      const changed = merge(JSON.parse(content || '{}'));
      setState('on', 'Synced'); return changed;
    } catch (e) { setState('err', String(e.message || e)); return false; }
  }
  async function push() {
    if (!token()) return;
    try {
      const id = await gistId();
      const r = await fetch(`${API}/gists/${id}`, { method: 'PATCH', headers: headers(), body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(snapshot()) } } }) });
      if (!r.ok) throw new Error(r.status === 401 ? 'GitHub rejected the token' : 'GitHub error ' + r.status);
      setState('on', 'Saved ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    } catch (e) { setState('err', String(e.message || e)); }
  }
  function changed(k) {
    if (!synced(k)) return;
    const ts = tsMap(); ts[k] = Date.now(); ls.set('gml_sync_ts', JSON.stringify(ts));
    if (!token()) return;
    clearTimeout(timer); timer = setTimeout(push, 2000);
  }
  function setState(s, msg) {
    state = s; lastMsg = msg || '';
    const b = document.getElementById('syncBtn'); if (!b) return;
    b.className = 'syncbtn ' + (s === 'on' ? 'on' : s === 'err' ? 'err' : '');
    b.textContent = s === 'on' ? 'Sync: on' : s === 'err' ? 'Sync: problem' : 'Sync: off';
    b.title = lastMsg;
    if (!document.getElementById('syncPanel').hidden) panel();
  }
  function panel() {
    const p = document.getElementById('syncPanel');
    const on = !!token();
    p.innerHTML = on ? `
      <b>Sync is on for this device.</b>
      <div class="small">${state === 'err' ? '<span style="color:var(--bad)">' + lastMsg.replace(/</g, '&lt;') + '</span>' : lastMsg ? lastMsg + '.' : ''} Your saved models, lines, logged picks and slider settings are stored in a private Gist on your GitHub account and merged whenever this page opens.</div>
      <div class="row"><button class="btn" id="syncNow" type="button">Sync now</button><button class="btn ghost" id="syncOff" type="button">Turn off on this device</button></div>`
    : `
      <b>Keep your picks and models the same on every device</b>
      <ol class="small">
        <li>On GitHub, open <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens</b>, and click <b>Generate new token</b>.</li>
        <li>Name it "5ive Lab sync", set an expiration, and under <b>Account permissions</b> set <b>Gists</b> to <b>Read and write</b>. Nothing else is needed.</li>
        <li>Generate it, copy it, and paste it below. Do this once on each device (phone, laptop).</li>
      </ol>
      <div class="row"><label class="sr" for="syncToken">GitHub token</label><input id="syncToken" type="password" autocomplete="off" placeholder="github_pat_…"><button class="btn accent" id="syncSave" type="button">Turn on sync</button></div>
      <div class="small muted">The token stays in this browser and can only read and write your Gists. ${state === 'err' ? '<br><span style="color:var(--bad)">' + lastMsg.replace(/</g, '&lt;') + '</span>' : ''}</div>`;
  }
  async function enable(t) {
    ls.set('gml_sync_token', t.trim()); ls.set('gml_sync_gist', '');
    setState('on', 'Connecting…');
    const changed = await pull();
    if (state === 'err') { ls.set('gml_sync_token', ''); panel(); return; }
    await push();
    if (changed) location.reload();
  }
  document.addEventListener('click', async (e) => {
    const id = e.target.id;
    if (id === 'syncBtn') { const p = document.getElementById('syncPanel'); p.hidden = !p.hidden; if (!p.hidden) panel(); }
    if (id === 'syncSave') { const v = document.getElementById('syncToken').value; if (v.trim()) enable(v); }
    if (id === 'syncNow') { const changed = await pull(); await push(); if (changed) location.reload(); }
    if (id === 'syncOff') { ls.set('gml_sync_token', ''); ls.set('gml_sync_gist', ''); setState('off'); panel(); }
  });
  window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && token() && timer) { clearTimeout(timer); push(); } });
  setState(state);
  return { pull, push, changed, enabled: () => !!token() };
})();
window.Sync = Sync;

document.getElementById('view').innerHTML = '<div class="empty">Loading this week\'s data…</div>';
const syncFirst = Sync.enabled() ? Promise.race([Sync.pull(), new Promise((r) => setTimeout(r, 4000))]) : Promise.resolve();
if (SPORT === 'edges') syncFirst.then(bootEdges); else
syncFirst.then(() => fetch('data/' + SPORT + '.json', { cache: 'no-cache' }))
  .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(boot)
  .catch((err) => {
    document.getElementById('view').innerHTML = '<div class="empty">Couldn\'t load the stats file (' + String(err.message || err) + '). Check your connection and reload the page.</div>';
  });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
