name: Probe data feeds (one-off)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/probe.py']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sample each feed
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/probe.py
      - name: Save samples
        run: |
          git add data/probe
          git diff --cached --quiet && exit 0
          git config user.name "5ive-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Feed samples"
          git pull --rebase origin main
          git push
